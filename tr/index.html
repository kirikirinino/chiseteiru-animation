<!DOCTYPE html>
<html lang="tr">
 <head>
    <meta charset="UTF-8">
    <title>Chiseteiru Animation</title>
    <link rel="stylesheet" href="style.css">
    
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Open+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
   
    <style>
        
        .slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; background-color: #000; }
        .slideshow img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: fade 15s infinite; }
        .slideshow img:nth-child(1) { animation-delay: 0s; }
        .slideshow img:nth-child(2) { animation-delay: 5s; }
        .slideshow img:nth-child(3) { animation-delay: 10s; }
        @keyframes fade { 0% {opacity: 0;} 10% {opacity: 0.6;} 33% {opacity: 0.6;} 43% {opacity: 0;} 100% {opacity: 0;} }
        
        
        .hero-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9); 
        }
        .hero-title { 
            font-family: 'Open Sans', sans-serif; 
            font-size: 90px; 
            font-weight: 700; 
            color: white; 
            letter-spacing: 5px; 
            margin-bottom: 10px; 
        }
        .hero-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 300;
            color: #dddddd; 
            letter-spacing: 6px;
        }

        .logo { font-family: 'Open Sans', sans-serif; } 
    </style>
</head>

        </a>
