  <style>
  
  .news-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 120px 20px 40px 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #121212; 
    color: #e0e0e0;
  }
  
  
  .news-header {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 40px;
    border-bottom: 1px solid #333;
    padding-bottom: 15px;
    letter-spacing: 2px;
  }

  
  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); 
    gap: 30px; 
  }

  
  .news-card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
    
    transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1; 
  }

  
  .news-card:hover {
    transform: translateY(-8px);
    border-color: #00e5ff82; 
    
    box-shadow: 0 15px 30px -5px rgba(0, 229, 255, 0.25), 0 0 15px rgba(0, 229, 255, 0.1);
  }

  
  .news-image {
    width: 100%;
    height: 55%; 
    object-fit: cover;
    background: #2a2a2a;
    
    -webkit-mask-image: linear-gradient(to top, transparent 0%, rgba(0,0,0,1) 35%);
    mask-image: linear-gradient(to top, transparent 0%, rgba(0,0,0,1) 35%);
  }

  
  .news-text {
    padding: 0 20px 20px 20px;
    display: flex;
    flex-direction: column;
    height: 45%; 
    margin-top: -15px; 
    position: relative;
    z-index: 2;
  }

  .news-date {
    font-size: 11px;
    color: #85999bc9; 
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
  }

  .news-title {
    font-size: 16px;
    color: #ffffffd0;
    margin: 0;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  
  .news-link {
    margin-top: auto; 
    display: block;
    color: #aaa;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
    border-top: 1px solid #333;
    padding-top: 12px;
    transition: color 0.3s, padding-left 0.3s;
  }

  .news-link:hover {
    color: #00e5ff87;
    padding-left: 5px; 
  }

  
  @media (max-width: 768px) {
    .news-grid {
      grid-template-columns: 1fr; 
    }
    .news-card {
      aspect-ratio: auto;
      height: 380px;
    }
  }
</style>


<div class="news-container">
  
  <h2 class="news-header">NEWS</h2>

        <a href="n/kyomaf.html" class="news-link">詳細を読む →</a>
      </div>
    </div>
